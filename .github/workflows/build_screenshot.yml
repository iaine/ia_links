name: Build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into package.json (e.g. 0.1.0)"
        required: false
        default: "0.0.1"

jobs:
  test:
    name: Unit tests + Electron smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Unit tests (pure logic, no Electron)
        run: npm test

      - name: Electron full-page-capture smoke test (real browser, headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a ./node_modules/.bin/electron --no-sandbox smoke-test.mjs

  build:
    name: Build (${{ matrix.os }})
    needs: test
    # Only build native installers on a version tag or a manual run -
    # ordinary pushes/PRs just get the fast unit-test + smoke-test job
    # above, to avoid burning CI minutes on three OS builds per commit.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Stamp version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION:-0.0.1}"
          fi
          echo "Building version $VERSION"
          npm pkg set version="$VERSION"

      - name: Build installer
        run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: ia-screenshotter-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
