<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IA Screenshotter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>IA Screenshotter</h1>
  <p class="subtitle">Full-page screenshots for a batch of URLs - paste a list (e.g. straight out of the IA Link Ripper).</p>

  <div id="message" class="message" hidden></div>

  <section class="input-section">
    <label for="urlListInput">URLs (one per line):</label>
    <textarea id="urlListInput" rows="8" placeholder="https://example.com"></textarea>
    <div class="actions">
      <button id="parseBtn" type="button">Load List</button>
      <span id="parseSummary" class="summary"></span>
    </div>
  </section>

  <section class="selection-section" id="selectionSection" hidden>
    <div class="selection-header">
      <label class="inline"><input type="checkbox" id="selectAll" checked> Select all</label>
      <span id="selectionCount" class="summary"></span>
    </div>
    <div id="urlTable" class="url-table"></div>
  </section>

  <section class="output-section">
    <button id="chooseFolderBtn" type="button">Choose Output Folder\u2026</button>
    <span id="outputFolderLabel" class="summary">No folder selected</span>
  </section>

  <section class="run-section">
    <label for="concurrencyInput">Concurrent captures:</label>
    <input type="number" id="concurrencyInput" min="1" max="8" value="3">
    <button id="startBtn" type="button" disabled>Start Capture</button>
    <button id="clearBtn" type="button">Clear</button>
  </section>

  <section class="progress-section">
    <div id="progressList"></div>
  </section>

  <script src="renderer.js"></script>
</body>
</html>
